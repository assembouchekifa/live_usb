LABEL arch
TEXT HELP
Boot the Arch Linux live system on BIOS.
It provides the Sway desktop and system maintenance tools.
ENDTEXT
MENU LABEL Live system (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Arch Linux live system on BIOS with speakup screen reader.
It provides the Sway desktop and system maintenance tools with speech feedback.
ENDTEXT
MENU LABEL Live system (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%

LABEL live_persistent
TEXT HELP
Boot the Arch Linux live system with persistent storage.
Changes are saved on the partition labeled persistence.
ENDTEXT
MENU LABEL Live USB Persistence (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_label=persistence cow_persistent=P cow_directory=live_usb %KERNEL_PARAMS%
